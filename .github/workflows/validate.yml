name: Validate app
on: [push, pull_request]
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Regression checks use only Node built-ins; no production credentials.
      - run: npm run check
      - run: npm test
