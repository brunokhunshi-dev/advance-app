<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Importar catálogo Advance</title><link rel="stylesheet" href="styles.css"><style>body{background:#f8f8fa;font-family:Arial,sans-serif;color:#040438}main{max-width:540px;margin:40px auto;padding:28px;background:white;border-radius:24px}h1{font-size:24px}label{display:block;margin:14px 0 6px}input{width:100%;padding:12px;border:1px solid #ddd;border-radius:12px;box-sizing:border-box}button{margin-top:18px;padding:14px 20px;border:0;border-radius:28px;background:#f51e30;color:white;cursor:pointer}button:disabled{opacity:.5;cursor:default}#status{white-space:pre-wrap;line-height:1.5}</style></head><body><main><h1>Importar catálogo Advance</h1><p id="catalog-summary">Carregando catálogo...</p><p>Os produtos serão cadastrados no banco do Advance Check com todas as propriedades do JSON. IDs existentes serão atualizados; os outros produtos permanecerão no banco.</p><form id="login-form"><label for="email">E-mail</label><input id="email" name="email" type="email" autocomplete="username" required><label for="password">Senha</label><input id="password" name="password" type="password" autocomplete="current-password" required><button type="submit">Entrar</button></form><p id="account"></p><button id="import-products" type="button" disabled>Cadastrar produtos no Firebase</button><p id="status" role="status" aria-live="polite"></p></main><script type="module" src="src/ui/product-import-page.js"></script></body></html>
